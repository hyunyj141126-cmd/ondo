<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="description" content="Ondo: an AI helper for making mobile games. Runs on your phone, no account needed.">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ondo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ondo AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile-first chat — drawer sidebar, composer docked to the bottom (centered under the greeting on wide screens for a new chat) */
:root{
  --bg:#faf9f5; --side:#f5f4ee; --surface:#ffffff; --ink:#1f1e1d; --ink-2:#3d3d3a; --muted:#73726c;
  --line:#e3e1d8; --hover:#ecebe4; --accent:#c96442; --accent-hover:#b5573a; --accent-ink:#ffffff; --accent-soft:#f5e6de;
  --bubble:#f0eee6; --code-bg:#f4f2ec; --code-head:#e9e6dc; --code-fg:#2b2a27; --danger:#b4412d; --ok:#4f7a3a;
  --shadow:rgba(60,50,30,.13); --scrim:rgba(20,18,14,.4);
  --serif:"Noto Serif KR", "Apple SD Gothic Neo", Georgia, serif;
  --sans:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --ink:#f0eee6; --ink-2:#dad8cf; --muted:#a3a198;
  --line:#3e3d39; --hover:#373734; --accent:#d97757; --accent-hover:#e48a6c; --accent-ink:#ffffff; --accent-soft:#4a3128;
  --bubble:#141413; --code-bg:#1d1d1b; --code-head:#2b2b28; --code-fg:#e8e6dc; --danger:#ef8f7a; --ok:#9cc983;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1f1e1d; --surface:#30302e; --ink:#f0eee6; --ink-2:#dad8cf; --muted:#a3a198;
  --line:#3e3d39; --hover:#373734; --accent:#d97757; --accent-hover:#e48a6c; --accent-ink:#ffffff; --accent-soft:#4a3128;
  --bubble:#141413; --code-bg:#1d1d1b; --code-head:#2b2b28; --code-fg:#e8e6dc; --danger:#ef8f7a; --ok:#9cc983;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}

.app{display:flex;height:100%}

/* ---------- sidebar ---------- */
.side{width:280px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:10px;padding-block:10px;transition:width .18s ease}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:24px;height:24px;color:var(--accent)}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.nav-item{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 10px;border-radius:10px;white-space:nowrap;font-size:15px;text-align:left;width:100%}
.nav-item:hover{background:var(--hover)}
.nav-item .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav-item .plus svg{width:14px;height:14px}
.nav-item.primary{color:var(--accent);font-weight:600}
.recents{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;margin-top:12px}
.recents-label{font-size:12px;color:var(--muted);padding:0 10px;white-space:nowrap}
.convs{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px;-webkit-overflow-scrolling:touch}
.conv{display:flex;align-items:center;border-radius:10px}
.conv .open{flex:1;min-width:0;text-align:left;min-height:40px;padding:6px 10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.conv:hover,.conv.active{background:var(--hover)}
.conv.active .open{font-weight:600}
.conv .del{color:var(--muted);min-height:40px;padding:0 10px;font-size:12px;opacity:0}
.conv:hover .del,.conv.active .del{opacity:1}
.conv .del:hover{color:var(--danger)}
.empty-recents{font-size:13px;color:var(--muted);padding:4px 10px}
.side-foot{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.mode-tag{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

.app.collapsed .side{width:62px}
.app.collapsed .side :is(.brand b,.label,.recents,.mode-tag){display:none}
.app.collapsed .side-top{flex-direction:column}
.app.collapsed .nav-item{justify-content:center;padding:6px 0}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.topbar{display:flex;align-items:center;gap:4px;min-height:54px;padding-block:6px;
  padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px))}
.topbar .mobile-only{display:none}
.chat-title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600;padding:0 8px}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.thread{max-width:760px;margin:0 auto;padding-block:8px 28px;display:flex;flex-direction:column;gap:26px}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;padding-block:16px 10vh;overflow-y:auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.greet{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.greet .logo{width:34px;height:34px;color:var(--accent);flex:none}
.greet h2{font-family:var(--serif);font-weight:400;font-size:clamp(25px,5.2vw,38px);line-height:1.3;margin:0;text-wrap:balance}
.greet-sub{margin:-12px 0 0;color:var(--muted);font-size:14px;text-align:center;text-wrap:balance}
.hero-slot{width:100%;max-width:760px}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:760px}
.starter{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
.starter:hover{border-color:var(--accent)}
.starter b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.starter b svg{width:16px;height:16px;color:var(--accent)}
.starter span{font-size:12.5px;color:var(--muted);line-height:1.45}

.dock{padding-block:4px 10px;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px))}
.dock-slot{max-width:760px;margin:0 auto}
.disclaimer{max-width:760px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 10px 8px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 22px -12px var(--shadow)}
.composer:focus-within{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.composer textarea{width:100%;border:0;background:none;resize:none;font:inherit;font-size:16px;color:var(--ink);max-height:38vh;min-height:26px;padding:2px 2px;outline:none}
.composer textarea::placeholder{color:var(--muted)}
.notice{font-size:13px;color:var(--danger);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notice button{color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0}
.c-row{display:flex;align-items:center;gap:4px;min-width:0}
.c-row .spacer{flex:1}
.pill{display:flex;align-items:center;gap:5px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);white-space:nowrap;min-width:0;max-width:52%}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill:hover{background:var(--hover)}
.pill svg{width:16px;height:16px;flex:none;color:var(--accent)}
.model-wrap{position:relative}
.model-btn{display:flex;align-items:center;gap:3px;min-height:36px;font-size:13px;color:var(--muted);padding:0 8px;border-radius:10px;white-space:nowrap}
.model-btn:hover{background:var(--hover);color:var(--ink)}
.model-btn svg{width:14px;height:14px}
.menu{position:absolute;right:0;bottom:calc(100% + 8px);width:min(260px,80vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px -12px var(--shadow);padding:6px;z-index:30}
.hero .menu{bottom:auto;top:calc(100% + 8px)}
.menu button{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 10px;border-radius:10px;min-height:44px}
.menu button:hover{background:var(--hover)}
.m-txt{display:flex;flex-direction:column;line-height:1.35;flex:1}
.m-txt b{font-size:14px;font-weight:600}
.m-txt span{font-size:12px;color:var(--muted)}
.check{width:16px;height:16px;color:var(--accent);visibility:hidden;margin-top:2px;flex:none}
[aria-checked="true"]>.check{visibility:visible}
.send{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-hover)}
.send:disabled{opacity:.35;cursor:default;background:var(--accent)}
.send svg{width:18px;height:18px}

/* messages */
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--bubble);border-radius:18px;padding:9px 15px;max-width:min(86%,600px);white-space:pre-wrap;word-break:break-word}
.msg.ai{display:flex;flex-direction:column;gap:8px;min-width:0}
.md{min-width:0;word-break:break-word;font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--ink)}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.6em 0}
.md h1,.md h2,.md h3{font-weight:600;line-height:1.4;margin:1.1em 0 .35em;text-wrap:balance}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}
.md ul,.md ol{padding-left:1.35em;margin:.5em 0}
.md li{margin:.25em 0}
.md li>ul,.md li>ol{margin:.2em 0}
.md a{color:var(--accent)}
.md strong{font-weight:600}
.md blockquote{margin:.8em 0;padding:.1em 0 .1em .9em;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);border:1px solid var(--line);padding:.05em .35em;border-radius:5px}
.md .code{margin:.8em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.md .code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--code-head);padding:2px 4px 2px 12px;font-family:var(--sans);font-size:12px;color:var(--muted)}
.md .code-head button{display:flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.md .code-head button:hover{background:var(--hover);color:var(--ink)}
.md .code-head svg{width:14px;height:14px}
.md pre{margin:0;padding:12px 14px;overflow-x:auto;color:var(--code-fg);font-family:var(--mono);font-size:12.5px;line-height:1.6;-webkit-overflow-scrolling:touch}
.md pre code{background:none;border:0;padding:0;font-size:inherit}
.md .tbl{overflow-x:auto;margin:.8em 0;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--side);font-weight:600}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--sans);font-size:14px}
.spin{width:22px;height:22px;color:var(--accent);animation:spin 1.1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tail{display:flex}
.actions{display:flex;gap:2px;flex-wrap:wrap}
.actions button{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;min-height:36px;padding:0 10px;border-radius:9px}
.actions button:hover{background:var(--hover);color:var(--ink)}
.actions svg{width:16px;height:16px}
.note{font-size:13px;color:var(--danger)}

/* sheets */
.sheet-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:86%;overflow-y:auto;padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px -20px var(--shadow)}
.sheet .grab{display:none;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 0}
.sheet h3{margin:0;font-family:var(--serif);font-weight:600;font-size:19px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .help{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.opt .m-txt b{font-size:14px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.txt{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.txt:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn.full{width:100%}
.status{font-size:13px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--danger)}

/* on-device model UI */
.dl{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-family:var(--sans);font-size:14px;line-height:1.55;background:var(--surface)}
.dl b{font-weight:600}
.dl p{margin:0;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:6px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.bar-txt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.mrow .m-txt{min-width:0;gap:4px}
.mrow-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;align-self:center;font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.actions .meta{align-self:center;font-size:11.5px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.mrow{flex-direction:column;align-items:stretch}.mrow-act{justify-content:flex-start}}

.scrim{display:none}
@media (max-width:900px){
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-100%);transition:transform .22s ease;
    padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .app.collapsed .side{width:min(300px,86vw)}
  .app.collapsed .side :is(.brand b,.label,.mode-tag){display:revert}
  .app.collapsed .side .recents{display:flex}
  .app.collapsed .side-top{flex-direction:row}
  .app.collapsed .nav-item{justify-content:flex-start;padding:6px 10px}
  .app.nav-open .side{transform:none;box-shadow:0 0 40px var(--shadow)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:35}
  .topbar .mobile-only{display:grid}
  .side .collapse-btn{display:none}
}
@media (max-width:640px){
  .hero{justify-content:flex-end;padding-bottom:12px;gap:18px}
  .starters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-back{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;width:100%;max-height:88%;padding-bottom:max(16px, env(safe-area-inset-bottom,0px));
    padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
  .sheet .grab{display:block}
  .disclaimer{display:none}
}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.side{transition:none}}
/* language-specific type */
:root[data-lang="ja"]{--serif:"Noto Serif JP", "Hiragino Mincho ProN", serif}
:root[data-lang="zh"]{--serif:"Noto Serif SC", "Songti SC", serif}
.m-meta{font-size:11.5px;color:var(--muted)}
.m-desc{font-size:12.5px;color:var(--muted)}
.opts.lang{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.opts.lang{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><b>Ondo</b></div>
      <button class="icon-btn collapse-btn" id="collapseBtn" type="button"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
    <button class="nav-item primary" id="newBtn" type="button"><span class="plus"><svg><use href="#i-plus"/></svg></span><span class="label" data-i18n="newChat"></span></button>
    <div class="recents">
      <div class="recents-label" data-i18n="recents"></div>
      <ul class="convs" id="convs"></ul>
    </div>
    <div class="side-foot">
      <button class="nav-item" id="settingsBtn" type="button"><svg class="i"><use href="#i-gear"/></svg><span class="label" data-i18n="settings"></span><span class="mode-tag" id="modeTag"></span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" type="button" data-i18n-aria="openSide"><svg class="i"><use href="#i-panel"/></svg></button>
      <div class="chat-title" id="chatTitle"></div>
      <button class="icon-btn mobile-only" id="newBtnTop" type="button" data-i18n-aria="newChat"><svg class="i"><use href="#i-pen"/></svg></button>
    </header>

    <section class="hero" id="hero">
      <div class="greet"><svg class="logo"><use href="#i-logo"/></svg><h2 id="greetText"></h2></div>
      <p class="greet-sub" data-i18n="greetSub"></p>
      <div class="hero-slot" id="heroSlot"></div>
      <div class="starters" id="starters"></div>
    </section>

    <div class="scroll" id="scroll" hidden><div class="thread" id="thread"></div></div>

    <div class="dock" id="dock">
      <div class="dock-slot" id="dockSlot"></div>
      <div class="disclaimer" id="disclaimerText"></div>
    </div>

    <form class="composer" id="form">
      <div class="notice" id="notice" hidden></div>
      <textarea id="input" rows="1" data-i18n-aria="inputAria" enterkeyhint="send"></textarea>
      <div class="c-row">
        <button class="pill" id="envBtn" type="button" data-i18n-aria="gameBtnAria"><svg><use href="#i-pad"/></svg><span id="envLabel"></span></button>
        <div class="spacer"></div>
        <div class="model-wrap">
          <button class="model-btn" id="modelBtn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="modelBtnAria"><span id="modelLabel"></span><svg><use href="#i-down"/></svg></button>
          <div class="menu" id="modelMenu" role="menu" hidden></div>
        </div>
        <button class="send" id="sendBtn" type="submit" data-i18n-aria="send" disabled><svg><use href="#i-up"/></svg></button>
      </div>
    </form>
  </main>
</div>

</div>

/* ================= markdown (built-in, escape-first) ================= */
function inline(s){
  const codes=[];
  s = esc(s).replace(/`([^`\n]+)`/g,(m,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\*\*([^*\n]+?)\*\*/g,"<strong>$1</strong>")
       .replace(/__([^_\n]+?)__/g,"<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,"$1<em>$2</em>")
       .replace(/~~([^~\n]+?)~~/g,"<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codes[+i]}</code>`);
}
const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
const LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
function blocks(text){
  const L=text.split("\n"); let out="", i=0;
  const startsBlock = l => /^(#{1,4})\s/.test(l)||/^>\s?/.test(l)||LIST_RE.test(l)||/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){ i++; continue; }
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ const n=Math.min(m[1].length,3); out+=`<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out+="<hr>"; i++; continue; }
    if(/^>\s?/.test(l)){ const q=[]; while(i<L.length&&/^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,"")); i++; } out+=`<blockquote>${blocks(q.join("\n"))}</blockquote>`; continue; }
    if(l.includes("|") && i+1<L.length && isTableSep(L[i+1])){
      const head=cells(l); i+=2; let body="";
      while(i<L.length && L[i].includes("|") && L[i].trim()){ body+="<tr>"+cells(L[i]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>"; i++; }
      out+=`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`; continue;
    }
    if(LIST_RE.test(l)){
      const ordered=/\d/.test(l.match(LIST_RE)[2]); const items=[];
      while(i<L.length){
        const lm=L[i].match(LIST_RE);
        if(lm){ const ind=lm[1].length; if(ind>=2 && items.length){ items[items.length-1].sub.push({ord:/\d/.test(lm[2]),t:lm[3]}); } else items.push({t:lm[3],sub:[]}); i++; }
        else if(L[i].trim() && /^\s{2,}/.test(L[i]) && items.length){ items[items.length-1].t+=" "+L[i].trim(); i++; }
        else break;
      }
      const tag=ordered?"ol":"ul";
      out+=`<${tag}>`+items.map(it=>{ let s=`<li>${inline(it.t)}`; if(it.sub.length){ const st=it.sub[0].ord?"ol":"ul"; s+=`<${st}>${it.sub.map(x=>`<li>${inline(x.t)}</li>`).join("")}</${st}>`; } return s+"</li>"; }).join("")+`</${tag}>`;
      continue;
    }
    const p=[]; while(i<L.length && L[i].trim() && !startsBlock(L[i]) && !(L[i].includes("|")&&i+1<L.length&&isTableSep(L[i+1]))){ p.push(inline(L[i])); i++; }
    if(p.length) out+=`<p>${p.join("<br>")}</p>`; else { out+=`<p>${inline(l)}</p>`; i++; }
  }
  return out;
}
function md(text){
  let out="", last=0; const re=/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g; let m;
  while((m=re.exec(text))){
    if(m.index===re.lastIndex){ re.lastIndex++; }
    out+=blocks(text.slice(last,m.index));
    const lng=(m[1]||"").trim()||"code";
    out+=`<div class="code"><div class="code-head"><span>${esc(lng)}</span><button type="button" class="copy-code">${icon("i-copy")}<span>${esc(t("copy"))}</span></button></div><pre><code>${esc(m[2].replace(/\n$/,""))}</code></pre></div>`;
    last=re.lastIndex; if(last>=text.length) break;
  }
  if(last<text.length) out+=blocks(text.slice(last));
  return out;
}

/* ================= on-device backend (WebLLM on the phone's GPU) ================= */
let webllm=null, engine=null, loadedModel=null, loadingModel=null, loadPromise=null, progressSink=null;
async function loadLib(){
  if(webllm) return webllm;
  if(window.webllm && window.webllm.MLCEngine){ webllm=window.webllm; return webllm; }
  let lastErr;
  for(const u of WEBLLM_URLS){ try{ webllm = await import(u); return webllm; }catch(e){ lastErr=e; } }
  throw {code:"lib_failed", message:String(lastErr&&lastErr.message||lastErr)};
}
async function isCached(modelId){ try{ const lib=await loadLib(); return await lib.hasModelInCache(modelId); }catch{ return false; } }
function ensureModel(m){
  if(!HAS_GPU) return Promise.reject({code:"no_webgpu"});
  if(engine && loadedModel===m.model) return Promise.resolve(engine);
  if(loadPromise && loadingModel===m.model) return loadPromise;
  loadingModel=m.model;
  const job = (async()=>{
    const lib = await loadLib();
    const cb = r => { if(progressSink) progressSink(r); };
    if(!engine) engine = new lib.MLCEngine({initProgressCallback: cb});
    else engine.setInitProgressCallback(cb);
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch{}
    let lock=null; try{ lock = await navigator.wakeLock?.request("screen"); }catch{}
    try{ loadedModel=null; await engine.reload(m.model); loadedModel=m.model; }
    finally{ try{ await lock?.release(); }catch{} }
    return engine;
  })();
  const p = job.finally(()=>{ if(loadPromise===p){ loadPromise=null; loadingModel=null; } });
  loadPromise = p;
  return p;
}
function localError(e){
  if(e && e.code) return e;
  const msg = String(e && e.message || e || "");
  if(/context window|exceed|prompt.*too long/i.test(msg)) return {code:"too_long", message:msg};
  if(/out of memory|OOM|allocate|device (was )?lost|GPUDevice|maxBuffer|limits/i.test(msg)) return {code:"oom", message:msg};
  if(/fetch|network|Failed to load|NetworkError|cache/i.test(msg)) return {code:"download_failed", message:msg};
  if(/shader-f16|f16/i.test(msg)) return {code:"no_f16", message:msg};
  return {code:"local_error", message:msg};
}
function trimForLocal(turns, budget){
  const out=[]; let used=0;
  for(let i=turns.length-1;i>=0;i--){
    let c=turns[i].content;
    if(i===turns.length-1 && c.length>budget) c=c.slice(-budget);
    if(used+c.length>budget && out.length) break;
    out.unshift({role:turns[i].role, content:c}); used+=c.length;
  }
  while(out.length && out[0].role!=="user") out.shift();
  return out;
}
async function localGenerate(turns, onText, signal, m){
  const eng = await ensureModel(m);
  if(signal.aborted) throw {code:"cancelled"};
  const messages=[{role:"system", content: LOCAL_RULES+"\n\n"+gameInfo()+langLine(langObj())}, ...trimForLocal(turns, 2200)];
  let raw="", truncated=false;
  const onAbort=()=>{ try{ eng.interruptGenerate(); }catch{} };
  signal.addEventListener("abort",onAbort,{once:true});
  try{
    const req={messages, stream:true, temperature: m.think?0.6:0.5, top_p:0.9, max_tokens:m.maxOut};
    if(/Qwen3/.test(m.model)) req.extra_body={enable_thinking:m.think};
    const chunks = await eng.chat.completions.create(req);
    for await (const ch of chunks){
      const c=ch.choices && ch.choices[0];
      const d=c && c.delta && c.delta.content || "";
      if(d){ raw+=d; onText(raw); }
      if(c && c.finish_reason==="length") truncated=true;
      if(signal.aborted) break;
    }
  }catch(e){ if(signal.aborted) throw {code:"cancelled", text:stripThink(raw).text}; throw Object.assign(localError(e),{text:stripThink(raw).text}); }
  finally{ signal.removeEventListener("abort",onAbort); }
  const text=stripThink(raw).text;
  if(signal.aborted) throw {code:"cancelled", text};
  if(!text.trim()) throw {code:"empty_completion"};
  return {text, truncated};
}

/* ================= sending ================= */
const FATAL=new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","unavailable"]);
const KNOWN_ERR=new Set(["rate_limited","session_expired","refused","empty_completion","prompt_too_large","upstream_error","no_webgpu","lib_failed","download_failed","oom","no_f16","too_long","local_error"]);
function errKey(code){ if(code==="no_webgpu") return "runLocalNoGpu"; return "err_"+(KNOWN_ERR.has(code)?code:(IN_CLAUDE?"upstream_error":"local_error")); }
function setBusy(b){ busy=b; sendBtn.innerHTML=icon(b?"i-stop":"i-up"); sendBtn.setAttribute("aria-label",t(b?"stop":"send")); updateSend(); }
function updateSend(){ sendBtn.disabled = busy ? false : !input.value.trim(); }

function askDownload(box, m, signal){
  return new Promise((resolve,reject)=>{
    box.innerHTML=`<div class="dl"><b></b><p></p><div class="row"><button type="button" class="btn primary sm" data-go></button><button type="button" class="btn sm" data-small hidden></button></div></div>`;
    box.querySelector("b").textContent=t("dlTitle",{name:t("m_"+m.id)});
    box.querySelector("p").textContent=t("dlBody",{size:m.size});
    const go=box.querySelector("[data-go]"), small=box.querySelector("[data-small]");
    go.textContent=t("dlGo"); small.textContent=t("dlSmall",{size:LOCAL_MODELS[0].size});
    if(m.id!=="fast") small.hidden=false;
    go.onclick=()=>resolve(m);
    small.onclick=()=>{ localId="fast"; store.set("ondo.local",localId); renderModel(); resolve(localModel()); };
    signal.addEventListener("abort",()=>reject({code:"cancelled"}),{once:true});
  });
}

async function run(c){
  c.err=null; c.errModel=false;
  const node=aiNode(), box=node.querySelector(".md");
  const status = key => { box.innerHTML=`<div class="thinking"><svg class="spin"><use href="#i-arc"/></svg><span></span></div>`; box.querySelector("span").textContent=t(key); };
  status("thinking");
  thread.appendChild(node); toBottom(true);
  const turns=c.turns.slice(-40).map(x=>({role:x.role,content:x.content})); while(turns.length&&turns[0].role!=="user") turns.shift();
  ctl=new AbortController(); setBusy(true);
  let raf=0, latest="";
  const paint=()=>{ raf=0; const s=IN_CLAUDE?{text:latest,thinking:false}:stripThink(latest);
    if(!s.text && s.thinking){ status("thinking"); return; }
    if(!s.text) return;
    if(!node.classList.contains("streaming")){ node.classList.add("streaming"); node.querySelector(".tail").hidden=false; }
    box.innerHTML=md(s.text); toBottom(false); };
  const onText=x=>{ latest=x; if(!raf) raf=requestAnimationFrame(paint); };
  try{
    let result;
    if(IN_CLAUDE) result = await claudeGenerate(turns, onText, ctl.signal);
    else {
      if(!HAS_GPU) throw {code:"no_webgpu"};
      let m=localModel();
      if(loadedModel!==m.model){
        status("checking");
        if(!(await isCached(m.model))) m = await askDownload(box, m, ctl.signal);
        status("preparing");
        progressSink = r => { box.innerHTML=`<div class="dl"><span class="bar-txt"></span><div class="bar"><i style="width:${pct(r)}%"></i></div></div>`; box.querySelector(".bar-txt").textContent=`${progressLabel(r)} ${pct(r)}%`; };
        const aborted = new Promise((_,rej)=>ctl.signal.addEventListener("abort",()=>rej({code:"cancelled"}),{once:true}));
        await Promise.race([ensureModel(m), aborted]);
        progressSink=null; status("thinking"); renderModel();
      }
      result = await localGenerate(turns, onText, ctl.signal, m);
    }
    if(raf) cancelAnimationFrame(raf);
    c.turns.push({role:"assistant",content:result.text});
    if(result.truncated) c.err="truncated";
  }catch(e){
    if(raf) cancelAnimationFrame(raf);
    progressSink=null;
    const er = IN_CLAUDE ? (e||{}) : localError(e);
    const code = er.code || "upstream_error";
    const partial = code!=="refused" ? (er.text||"") : "";
    if(partial) c.turns.push({role:"assistant",content:partial, stopped: code==="cancelled"});
    if(IN_CLAUDE && FATAL.has(code)){ sampleState="off"; refreshNotice(); c.err = code==="not_granted" ? "err_not_granted" : "err_unavailable"; }
    else if(code!=="cancelled"){ c.err = errKey(code); c.errModel = !IN_CLAUDE && ["oom","no_f16","local_error"].includes(code); }
  }finally{
    ctl=null; setBusy(false); c.updated=Date.now(); save(); render();
    if(!mobileMQ.matches) input.focus();
  }
}
async function send(){
  const text=input.value.trim(); if(!text||busy) return;
  let c=cur();
  if(!c){ c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:text.slice(0,30)+(text.length>30?"…":""), turns:[], updated:Date.now()}; convs.unshift(c); currentId=c.id; }
  else convs=[c,...convs.filter(x=>x.id!==c.id)];
  c.err=null; c.turns.push({role:"user",content:text});
  input.value=""; autosize(); if(mobileMQ.matches) input.blur(); save(); render();
  await run(c);
}
function regenerate(){ const c=cur(); if(!c||busy) return; const last=c.turns[c.turns.length-1]; if(last&&last.role==="assistant") c.turns.pop(); c.err=null; save(); render(); run(c); }
function retry(){ const c=cur(); if(!c||busy) return; c.err=null; render(); run(c); }
function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight, innerHeight*0.38)+"px"; updateSend(); }
